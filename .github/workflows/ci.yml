# Continuous integration: runs on every push and pull request.
#   backend  - unit + route tests (no database)
#   frontend - production build
#   smoke    - full workflow test (~160 checks) against a throwaway MySQL 8 service
# Only throwaway values are used here; no real passwords or secrets.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-throwaway"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_PWD: ci-root-throwaway          # used by the mysql client below
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-throwaway
      DB_NAME: smart_campus
      PORT: 5099
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      UPLOAD_DIR: ${{ runner.temp }}/uploads
      ADMIN_PASSWORD: ci-admin-throwaway-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Load schema and migrations
        run: |
          mysql -h 127.0.0.1 -u root -e "SET GLOBAL event_scheduler = ON;"
          mysql -h 127.0.0.1 -u root < database/schema.sql
          for f in database/migrations/*.sql; do
            echo "== $f"; mysql -h 127.0.0.1 -u root < "$f"
          done
          # migrations must be safe to run twice
          for f in database/migrations/*.sql; do mysql -h 127.0.0.1 -u root < "$f"; done

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        run: |
          nohup node server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5099/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Set starter admin password
        working-directory: backend
        run: node scripts/create-admin.js --email admin@smartcampus.local

      - name: Run smoke test
        working-directory: backend
        run: API_URL=http://localhost:5099/api ADMIN_PW="$ADMIN_PASSWORD" npm run smoke

      - name: Backend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"
